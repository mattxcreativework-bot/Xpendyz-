<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XPENDYZ STUDIO</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="brand"><span>⚡</span> XPENDYZ</div>
            <nav class="nav-list">
                <a href="#" class="nav-link active" onclick="switchTab('workspace')">Workspace</a>
                <a href="#" class="nav-link" onclick="switchTab('projects')">Projects</a>
                <a href="#" class="nav-link" onclick="switchTab('assistant')">AI Assistant</a>
                <a href="#" class="nav-link" onclick="switchTab('editor')">Editor</a>
            </nav>
        </aside>
        
        <main class="main-area">
            <header class="topbar">
                <span>Personal Workspace</span>
                <div class="avatar">AM</div>
            </header>
            
            <div id="workspace" class="content-tab">
                <h1>Make room for <span style="color:#78c7ff">what’s next.</span></h1>
                <p class="subtle">O seu ambiente moderno de criação e código.</p>
                <button class="btn-primary" onclick="switchTab('editor')">Começar a Codar</button>
            </div>

            <div id="projects" class="content-tab" style="display:none;">
                <h2>Projetos</h2>
                <p class="subtle">Gerencie seus códigos locais.</p>
            </div>

            <div id="assistant" class="content-tab" style="display:none;">
                <h2>Assistente IA</h2>
                <p class="subtle">Pronto para ajudar nas suas ideias.</p>
            </div>

            <div id="editor" class="content-tab" style="display:none;">
                <h2>Editor de Código</h2>
                <textarea id="codeEditor" rows="10" style="width:100%; background:#050a12; color:#fff; padding:15px; border-radius:8px; border:1px solid #333;" placeholder="Escreva seu código aqui..."></textarea>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
